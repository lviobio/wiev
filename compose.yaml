services:
  php:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .docker/services/php
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
        CONTAINER_USER: "www"
        ENTRYPOINT: "docker-php-entrypoint"
    restart: unless-stopped
    env_file:
      - .docker/env/php.env
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
    depends_on:
      - db
    volumes:
      - .:/app
      - ./.docker/services/php/.bashrc:/home/www/.bashrc:ro
      - ./.docker/services/php/override.ini:/usr/local/etc/php/conf.d/override.ini:ro
      - ./.docker/services/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    networks:
      - main

  supervisor:
    build:
      context: .docker/services/php
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
        CONTAINER_USER: "root"
        ENTRYPOINT: "docker-supervisor-entrypoint"
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - .:/app
      - ./.docker/services/php/override.ini:/usr/local/etc/php/conf.d/override.ini:ro
      - ./.docker/services/php/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./.docker/services/php/supervisor/laravel-schedule.conf:/etc/supervisor/conf.d/laravel-schedule.conf:ro
      - ./.docker/services/php/supervisor/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf:ro
    networks:
      - main

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    tty: true
    ports:
      - "${EXPOSE_WEB_PORT:-7000}:80"
    volumes:
      - ./.docker/services/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app
    networks:
      - main

  vite:
    image: node:24-alpine
    entrypoint: /bin/sh
    restart: unless-stopped
    ports:
      - "${EXPOSE_VITE_PORT:-7001}:${EXPOSE_VITE_PORT:-7001}"
    working_dir: /front
    volumes:
      - .:/front
    tty: true
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    networks:
      - main
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${EXPOSE_DB_PORT:-7002}:5432"
    volumes:
      - db-data:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - main

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${EXPOSE_MINIO_PORT:-7003}:9000"
      - "${EXPOSE_MINIO_CONSOLE_PORT:-7004}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - main

  # One-shot: waits for minio, then makes sure the app's bucket exists and is
  # readable anonymously (media URLs are plain, unsigned `url()` calls - see
  # config/filesystems.php - so this mirrors the "public" local disk's
  # world-readable symlink). Reuses the app's own S3 credentials as the mc
  # alias via MC_HOST_*, so there's one source of truth for them, not two.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@minio:9000
    entrypoint: >
      /bin/sh -c "
      until mc ls local >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/${AWS_BUCKET};
      mc anonymous set download local/${AWS_BUCKET};
      "
    networks:
      - main

networks:
  main:
volumes:
  db-data:
  minio-data:
