server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /app/public;

    # Keep in step with upload_max_filesize/post_max_size (.docker/services/php/override.ini):
    # the largest single request either upload path sends is one chunked-upload chunk,
    # capped at uploads.chunked.chunk_max_size (20MB).
    client_max_body_size 30M;

    location ~ \.php$ {
        fastcgi_read_timeout 600s;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
