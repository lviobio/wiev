max_execution_time = 300
memory_limit = 1024M

; PHP's stock defaults (upload_max_filesize=2M, post_max_size=8M) are below both
; media-library.max_file_size (10MB, the single-shot /uploads cap) and
; uploads.chunked.chunk_max_size (20MB, the largest one request a chunked upload
; sends) - a request within either app-level limit could still be silently emptied
; by PHP before it ever reaches app code. post_max_size stays above
; upload_max_filesize per PHP's own recommendation, for multipart overhead/other
; fields. Keep in step with nginx's client_max_body_size (.docker/services/web/nginx.conf).
upload_max_filesize = 25M
post_max_size = 30M